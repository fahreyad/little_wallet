version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: income-tracker-app
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8082
      DB_CONNECTION: mysql
    networks:
      - common-net

networks:
  common-net:
    external: true
