<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d6efd">
    <title>You're offline — Little Wallet</title>
    <style>
        :root {
            color-scheme: light dark;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4f6fb;
            color: #0f172a;
            padding: 1.5rem;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #0f172a; color: #f4f6fb; }
            .card { background: #1e293b !important; border-color: #334155 !important; }
            .subtitle { color: #94a3b8 !important; }
        }
        .card {
            max-width: 360px;
            width: 100%;
            text-align: center;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }
        .icon {
            width: 3.5rem;
            height: 3.5rem;
            margin: 0 auto 1.25rem;
            border-radius: 0.875rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            color: #fff;
            font-size: 1.5rem;
        }
        h1 {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0 0 0.5rem;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #64748b;
            margin: 0 0 1.5rem;
            line-height: 1.5;
        }
        button {
            border: none;
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.65rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
        }
        button:active {
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⚠</div>
        <h1>You're offline</h1>
        <p class="subtitle">Little Wallet needs an internet connection to load your data. Check your connection and try again.</p>
        <button onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
